# Automatically labels PRs based on size.

name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });

            const totalAdditions = prFiles.reduce((sum, f) => sum + f.additions, 0);
            const totalDeletions = prFiles.reduce((sum, f) => sum + f.deletions, 0);
            const linesChanged = totalAdditions + totalDeletions;
            const filesChanged = prFiles.length;

            let sizeLabel;
            if (filesChanged > 100 || linesChanged > 1000) {
              sizeLabel = 'size/xl';
            } else if (filesChanged > 25 || linesChanged > 400) {
              sizeLabel = 'size/l';
            } else if (filesChanged > 10 || linesChanged > 100) {
              sizeLabel = 'size/m';
            } else {
              sizeLabel = 'size/s';
            }

            // Get existing labels
            const { data: prInfo } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });
            const existingLabels = prInfo.labels.map(l => l.name);

            // Remove other size labels, keep only appropriate one
            const sizeLabels = ['size/s', 'size/m', 'size/l', 'size/xl'];
            for (const label of sizeLabels) {
              if (existingLabels.includes(label)) {
                await github.rest.issues.removeLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr,
                  name: label
                });
              }
            }

            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              labels: [sizeLabel]
            });