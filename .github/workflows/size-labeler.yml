# Automatically labels PRs based on size.

name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });

            const totalAdditions = prFiles.reduce((sum, f) => sum + f.additions, 0);
            const totalDeletions = prFiles.reduce((sum, f) => sum + f.deletions, 0);
            const linesChanged = totalAdditions + totalDeletions;
            const filesChanged = prFiles.length;

            let sizeLabel;
            if (filesChanged > 100 || linesChanged > 1000) {
              sizeLabel = 'size/xl';
            } else if (filesChanged > 25 || linesChanged > 400) {
              sizeLabel = 'size/l';
            } else if (filesChanged > 10 || linesChanged > 100) {
              sizeLabel = 'size/m';
            } else {
              sizeLabel = 'size/s';
            }

            // Get existing labels
            const { data: prInfo } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr
            });
            const existingLabels = prInfo.labels.map(l => l.name);

            // Remove other size labels by replacing with just the new one
            const sizeLabels = ['size/s', 'size/m', 'size/l', 'size/xl'];
            const labelsToRemove = existingLabels.filter(l => sizeLabels.includes(l));
            if (labelsToRemove.length > 0) {
              await github.rest.issues.deleteLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                name: labelsToRemove[0]
              });
            }

            // Add new size label (addLabels replaces automatically for same label; for others, previous was removed above)
            if (!existingLabels.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                labels: [sizeLabel]
              });
            }