name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply size label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          TOTAL=$((ADDITIONS + DELETIONS))
          if   [ "$TOTAL" -le 9   ]; then LABEL="size/XS"
          elif [ "$TOTAL" -le 29  ]; then LABEL="size/S"
          elif [ "$TOTAL" -le 99  ]; then LABEL="size/M"
          elif [ "$TOTAL" -le 499 ]; then LABEL="size/L"
          else                            LABEL="size/XL"
          fi
          echo "PR changes $TOTAL lines -> $LABEL"

          for old in size/XS size/S size/M size/L size/XL; do
            [ "$old" = "$LABEL" ] && continue
            gh pr edit "$PR_NUMBER" --remove-label "$old" 2>/dev/null || true
          done
          gh pr edit "$PR_NUMBER" --add-label "$LABEL"

  title-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate conventional-commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if ! echo "$TITLE" | grep -Eq "$REGEX"; then
            echo "::error::PR title must follow conventional-commits format."
            echo "  Expected: <type>(<optional scope>): <summary>"
            echo "  Types:    feat | fix | docs | style | refactor | perf | test | build | ci | chore | revert"
            echo "  Examples: 'feat: add history search', 'fix(cli): handle empty input'"
            exit 1
          fi
          echo "Title OK"
