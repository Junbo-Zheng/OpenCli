name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect ninja-build
          pip3 install kconfiglib

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja expect
          pip3 install kconfiglib --break-system-packages

      - name: Configure
        run: cmake -B build -G Ninja
        env:
          CC: ${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure
